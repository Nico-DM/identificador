name: ci

on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Change to API directory
        run: |
            cd identificador-api

      - name: Set up uv
        uses: andgineer/uv-venv@v3

      - name: Install dev dependencies
        run: |
            uv pip install basedpyright
            uv pip install -r requirements-dev.txt

      - name: Lint with basedpyright
        run: |
            basedpyright

      - name: Test with pytest
        run: |
            pytest
