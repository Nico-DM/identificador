name: ci

on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout
      
      - name: Set up Python 3.11
        uses: actions/setup-python
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
            python -m pip install --upgrade pip
            pip install basedpyright
            pip install -r identificador-api/requirements-dev.txt

      - name: Lint with basedpyright
        run: |
            basedpyright

      - name: Test with pytest
        run: |
            cd identificador-api
            pytest
