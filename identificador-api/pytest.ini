[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: live frontend/backend/SerpAPI (run with: pytest -m integration)
    acceptance: RF/RNF acceptance criteria (run with: pytest -m acceptance)
    rf(id): requirement id under test (used by acceptance report)
addopts = -m "not integration and not acceptance"
