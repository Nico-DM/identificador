services:
  - type: web
    name: identificador-api
    env: python
    rootDir: identificador-api
    pythonVersion: 3.11
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SERPAPI_API_KEY
        sync: false
      - key: SERPAPI_ENDPOINT
        value: https://serpapi.com/search.json
      - key: SERPAPI_ENGINE
        value: google_lens
      - key: SEARCH_TTL_SECONDS
        value: 900
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CACHE_TTL_SECONDS
        value: 604800
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_SEARCH_PER_HOUR
        value: "10"
      - key: RATE_LIMIT_DEEP_PER_HOUR
        value: "5"
      - key: RATE_LIMIT_RESULTS_PER_MINUTE
        value: "300"

