services:
  - type: web
    name: identificador-api
    runtime: python
    rootDir: identificador-api
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SERPAPI_API_KEY
        sync: false
      - key: SERPAPI_ENDPOINT
        value: https://serpapi.com/search.json
      - key: SEARCH_ENGINE
        value: google_reverse_image
      - key: SEARCH_TTL_SECONDS
        value: 900
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: search-uploads
      - key: UPLOAD_MAX_BYTES
        value: "5242880"
      - key: CACHE_TTL_SECONDS
        value: 604800
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_SEARCH_PER_HOUR
        value: "10"
      - key: RATE_LIMIT_DEEP_PER_HOUR
        value: "5"
      - key: RATE_LIMIT_RESULTS_PER_MINUTE
        value: "300"
